{% extends 'base.html' %}
{% block conteudo %}
<h2>{{ quarto.nome }}</h2>

<img src="{{ quarto[4] }}" alt="{{ quarto[1] }}" style="max-width: 100%; border-radius: 10px;">

<p>{{ quarto.[3] }}</p>
<p><strong>Preço:</strong> R$ {{ quarto[2] }} por noite</p>

<a href="{{ url_for('index') }}">⬅ Voltar para lista de quartos</a>
{% endblock %}
