<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Paginados</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        a {
            color: black;
            text-decoration: none;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: auto;
        }

        li {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            padding: 15px;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }

        li:hover {
            background: #e9ecef;
        }

        nav {
            margin-top: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .page-item {
            margin: 0 5px;
        }

        .page-link {
            display: block;
            padding: 10px 15px;
            color: #007bff;
            text-decoration: none;
            border: 1px solid #007bff;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }

        .page-link:hover {
            background: #007bff;
            color: #fff;
        }

        .active .page-link {
            background: #0056b3;
            color: #fff;
            border-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Produtos</h1>

    <ul>
        {% for produto in produtos %}
            <li>
                <a href="{{ url_for('detalhe_produto', produto_id=produto.id) }}">
                    {{ produto.nome }}
                </a>

                <span>R$ {{ "%.2f"|format(produto.preco) }}</span>
            </li>
        {% endfor %}
    </ul>

    <nav>
        <ul class="pagination">
            {% for page_num in range(1, total_pages + 1) %}
                <li class="page-item {% if page == page_num %}active{% endif %}">
                    <a href="{{ url_for('listar_produtos_paginados', page=page_num) }}" class="page-link">
                        {{ page_num }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </nav>

</body>
</html>
