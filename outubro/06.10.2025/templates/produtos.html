<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
            padding: 10px 15px;
            transition: background 0.3s;
        }

        li:hover {
            background: #e9ecef;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Nossos Produtos</h1>

    <ul>
        {% for produto in produtos %}
            <li>
                <a href="{{ url_for('detalhe_produto', produto_id=produto.id) }}">
                    {{ produto.nome }}
                </a>
                — R$ {{ "%.2f"|format(produto.preco) }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
