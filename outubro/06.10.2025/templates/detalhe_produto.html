<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ produto.nome if produto else "Produto não encontrado" }}</title>
</head>
<body>
{% if produto %}
    <h1>{{ produto.nome }}</h1>
    <p><strong>Preço:</strong> R$ {{ "%.2f"|format(produto.preco) }}</p>

    <a href="{{ url_for('listar_produtos') }}">⬅ Voltar para lista</a>
{% else %}
    <h2>Produto não encontrado ❌</h2>
    <a href="{{ url_for('listar_produtos') }}">⬅ Voltar</a>
{% endif %}
</body>
</html>
