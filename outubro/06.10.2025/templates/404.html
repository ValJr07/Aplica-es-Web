<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #d9534f;
            font-size: 2.5rem;
        }

        p {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #0056b3;
        }
    </style>

</head>
<body>

    <h1>Erro 404 - Página não encontrada</h1>
    <p>Oops! Parece que a página que você está procurando não existe.</p>

    <a href="{{ url_for('listar_produtos') }}">Voltar para a página inicial</a>

</body>
</html>
